      <h1 class="wordmark">JARV1S</h1>
      <p id="headline" class="headline">Starting JARV1S</p>

      <p id="elapsed" class="elapsed hidden" aria-live="polite"></p>

      <ol id="track" class="track" aria-label="Startup progress">

          <span class="track-label">Check</span>
        </li>
        <li class="track-step" data-milestone="services">
          <span class="track-bar"></span>

          <span class="track-label">JARV1S</span>
        </li>
        <li class="track-step" data-milestone="ready">
          <span class="track-bar"></span>
          <span class="track-label">Ready</span>
        </li>
      </ol>

      <details id="details" class="details">
        <summary>Startup details</summary>
        <div id="boot-log" class="boot-log" aria-live="off"></div>
      </details>

      <p id="detail" class="detail"></p>
      <div class="actions">
