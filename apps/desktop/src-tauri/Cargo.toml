[package]
name = "jarvis-desktop"
version = "0.6.0"
description = "JARV1S Host desktop shell"
authors = ["JARV1S"]
edition = "2021"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jarvis-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "process", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
libc = "0.2"
urlencoding = "2"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
coreaudio-sys = { version = "0.2.18", default-features = false, features = ["core_audio"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-location = "0.3.2"
objc2-event-kit = "0.3.2"
block2 = "0.6"
dispatch2 = "0.3"
