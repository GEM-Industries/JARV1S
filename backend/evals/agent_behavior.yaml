  input: Is my afternoon clear tomorrow?
  script:
  - type: tool_call
    capability: calendar.get_events
    arguments:
      start_date: tomorrow
      end_date: tomorrow
  - type: tool_output
    content: '{"events":[],"match_status":"none","coverage":"partial","failed_providers":["microsoft"],"truncated":false}'
  - type: text
    content: I couldn't verify your work calendar, so I can't confirm that the afternoon is clear.
