  category: tool_selection
  tier: probe
  source: user
  text_input: true
  input: Every morning at 8 turn the lights on warm and bright, at 8pm make them red and dim, and at 11pm turn them off.
  script:
  - type: tool_call
    capability: scheduler.defer
    arguments:
      when: 11pm
      instruction: Turn the lights off.
      recurrence: daily
      confirmed: true
  - type: tool_output
    content: 'three recurring deferred instructions scheduled.'
  - type: text
    content: Done. I set those three daily light routines.
  assert:
    tools_called:
    - scheduler.defer
    tools_forbidden:
    - automations.create_rule
    max_tool_calls: 4
- id: probe_conditional_monday_wake_rule_prefers_rules_create
  priority: P1
  category: tool_selection
  tier: probe
  source: user
  text_input: true
  input: Every Monday at 8am wake me up unless I have a meeting before 11.
  script:
  - type: tool_call
    capability: rules.create
    arguments:
      name: Monday conditional wake up
      origin:
        kind: time
        when: Monday 8am
        recurrence: weekly
      action:
        decision: offer
        message: Conditional Monday wake up
        instructions: Check my calendar before 11am. If I do not have a meeting before 11, wake me up; otherwise do not wake
          me.
      delivery: announce
      attention: critical
      sound: alarm
      confirmed: true
  - type: tool_output
    content: 'Rule ''Monday conditional wake up'' created.'
  - type: text
    content: Done. I'll check your calendar each Monday before waking you.
  assert:
    tools_called:
    - rules.create
    tools_forbidden:
    - automations.create_rule
    - scheduler.add_alarm
    max_tool_calls: 2
- id: probe_calendar_relative_reminder_uses_automation_contract
  priority: P1
  category: tool_arguments
  tier: probe
  source: user
  text_input: true
  input: Give me a heads-up ten minutes before each appointment.
  script:
  - type: tool_call
    capability: automations.list_available_triggers
    arguments:
      source: calendar
  - type: tool_output
    content: calendar.starting — Calendar event starts
  - type: tool_call
    capability: automations.create_rule
    arguments:
      name: Upcoming appointment
      trigger:
        source: calendar
        event: starting
        offset: -10
      action:
        decision: tell
        message: Your appointment starts in ten minutes.
  - type: tool_output
    content: Preview only. Automation 'Upcoming appointment' was not created.
  - type: text
    content: Here is the automation preview for your approval.
  assert:
    tools_called:
    - automations.list_available_triggers
    - automations.create_rule
    expected_arguments:
      calendar_source: '"source": "calendar"'
      starting_event: '"event": "starting"'
      negative_offset: '"offset": -10'
    tools_forbidden:
    - scheduler.remind
    max_tool_calls: 2
