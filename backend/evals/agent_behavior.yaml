# Agent behavior eval cases — model in-turn decisions only.
#
# Mock-tier cases drive AssistantOrchestrator._execute_turn with scripted AgentEvents.
# Live-tier cases (tier: live) call the real LLM when the runner is invoked with --live.
# Probe-tier cases (tier: probe) are opt-in prompt tuning probes via --probe --live.

meta:
  default_mock_runs: 1
  default_live_runs: 3
  default_probe_runs: 3
  default_live_temperature: 0
  pass_threshold: 0.67
  probe_pass_threshold: 0.67
cases:
- id: maps_near_me_open_now_uses_place_details
  priority: P0
  category: tool_selection
  tier: mock
  source: user
  text_input: true
  input: Is there a cafe near me that's open right now?
  session_context:
    location:
      latitude: -33.8688
      longitude: 151.2093
      source: gps
    device_kind: phone
  script:
  - type: tool_call
    capability: google_maps.search_nearby
    arguments:
      included_types:
      - cafe
  - type: tool_output
    content: '{"places":[{"id":"ChIJcafe1","displayName":{"text":"Local Roast"},"formattedAddress":"1 George St, Sydney"}]}'
  - type: tool_call
    capability: google_maps.get_place_details
    arguments:
      place_id: ChIJcafe1
  - type: tool_output
    content: '{"displayName":{"text":"Local Roast"},"currentOpeningHours":{"openNow":true},"regularOpeningHours":{"weekdayDescriptions":["Monday:
      7:00 AM – 4:00 PM"]}}'
  - type: text
    content: Local Roast is open now.
  assert:
    tools_called:
    - google_maps.search_nearby
    - google_maps.get_place_details
    tools_forbidden:
    - search.web
    - time
    response_contains:
    - open
    max_tool_calls: 3
- id: probe_maps_route_uses_search_route_target
  priority: P0
  category: tool_selection
  tier: probe
  source: user
  text_input: false
  pin_manifest: true
  routed_tools:
  - google_maps.search_places
  - google_maps.get_route
  input: Find the nearest Anytime Fitness and tell me how long the drive takes.
  session_context:
    location:
      latitude: 40.7128
      longitude: -74.006
      source: gps
    device_kind: phone
  live_tool_outputs:
  - '[PlaceSummary(place_id=''places/gym-1'', name=''Anytime Fitness'', route_target=''100 Example Street, Testville'', address=''100
    Example Street, Testville'')]'
  - RouteSummary(route_target='100 Example Street, Testville', travel_mode='DRIVE', distance_km=4.8, duration_minutes=7.5)
  assert:
    tools_called:
    - google_maps.search_places
    - google_maps.get_route
    expected_arguments:
      route_target: route_target
    response_contains:
    - '7'
    max_tool_calls: 3
- id: probe_followup_transit_lookup_emits_tool_call
  priority: P0
  category: tool_selection
  tier: probe
  source: user
  text_input: false
