[project]
name = "jarvis-backend"
version = "0.6.1"
description = "Personal AI Assistant Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
    "pymongo==4.5.0",
    "motor==3.3.1",
    "python-multipart>=0.0.6",
    "pyaudio>=0.2.14",
    "numpy>=2.2.3",
    "openai>=2.14.0",
    "soundfile>=0.13.1",
    "mlx-whisper>=0.4.3",
    "onnxruntime==1.24.4",
    "ten-vad>=1.0.6.8",
    "pyyaml>=6.0.3",
    "python-weather>=2.1.1",
    "openwakeword>=0.6.0",
    "httpx>=0.28.1",
    "fastembed>=0.7.4",
    "psutil>=7.2.2",
    "google-auth>=2.48.0",
    "google-auth-oauthlib>=1.3.0",
    "cartesia>=3.2.0",
    "tiktoken>=0.7.0",
    "msal>=1.35.1",
    "claude-agent-sdk>=0.1.52",
    "nanoid>=2.0.0",
    "dateparser>=1.2.0",
    "keyring>=25",
    "cryptography>=42",
    "litellm>=1.89.2",
    "sherpa-onnx>=1.10.0",
    "livekit-agents>=1.6.6",
    "kokoro-onnx>=0.5.0",
    "ddgs>=9.14.4",
    "cursor-sdk>=1.0.29",
]

[project.scripts]
jarvis-backend = "jarvis_backend:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "services", "plugins"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[dependency-groups]
dev = [
    "grimp>=3.14",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "watchfiles>=1.1.1",
]
