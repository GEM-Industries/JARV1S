name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - uses: astral-sh/setup-uv@v8

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install native test dependencies
        run: brew install portaudio

      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --locked --python 3.12
          uv run --python 3.12 pytest -q

      - name: Frontend build and audit
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Desktop tests and release contracts
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build:shell
          npm run test:release-scripts
          npm audit --omit=dev --audit-level=high
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Agent behavior trust gate
        working-directory: backend
        run: uv run python tools/evaluate_agent_behavior.py --priority P0 --label ci-agent-p0
